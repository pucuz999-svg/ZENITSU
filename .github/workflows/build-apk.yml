name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Assemble Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          can_write_sdk() {
            [ -d "$1" ] && [ -w "$1" ] && mkdir -p "$1/licenses" 2>/dev/null && touch "$1/licenses/.ci_write_test" 2>/dev/null && rm -f "$1/licenses/.ci_write_test"
          }
          if ! can_write_sdk "$SDK_DIR"; then
            if can_write_sdk "/usr/local/lib/android/sdk"; then
              SDK_DIR="/usr/local/lib/android/sdk"
            else
              SDK_DIR="$HOME/android-sdk"
              mkdir -p "$SDK_DIR"
            fi
          fi

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools into $SDK_DIR..."
            TMP_ZIP="$(mktemp /tmp/cmdline-tools-XXXXXX.zip)"
            TMP_EXTRACT="$(mktemp -d)"
            CMDLINE_URL="$(curl -fsSL https://developer.android.com/studio | grep -oE 'https://dl\.google\.com/android/repository/commandlinetools-linux-[0-9]+_latest\.zip' | head -n 1 || true)"
            if [ -z "$CMDLINE_URL" ]; then
              CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
            fi
            curl -fsSL "$CMDLINE_URL" -o "$TMP_ZIP"
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            unzip -q "$TMP_ZIP" -d "$TMP_EXTRACT"
            if [ -d "$TMP_EXTRACT/cmdline-tools" ]; then
              cp -a "$TMP_EXTRACT/cmdline-tools/." "$SDK_DIR/cmdline-tools/latest/"
            elif [ -d "$TMP_EXTRACT/tools" ]; then
              cp -a "$TMP_EXTRACT/tools/." "$SDK_DIR/cmdline-tools/latest/"
            fi
            rm -rf "$TMP_ZIP" "$TMP_EXTRACT"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Using sdkmanager: $SDKMANAGER (SDK root: $SDK_DIR)"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36.1" \
            "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ensure environment properties file
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Prepare stable APK filename
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Expected debug APK not found at $APK_SOURCE"
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_SOURCE" release-assets/Zenitsu_2.0-debug.apk
          ls -lh release-assets/Zenitsu_2.0-debug.apk

      - name: Upload Debug APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenitsu_2.0-debug-apk
          path: release-assets/Zenitsu_2.0-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zenitsu_2.0 Debug APK v1.0.${{ github.run_number }}
          body: |
            Automated debug APK build from commit `${{ github.sha }}`.

            ### Direct APK Download
            Download `Zenitsu_2.0-debug.apk` from the release assets below, or use the permanent latest download link:
            `https://github.com/${{ github.repository }}/releases/latest/download/Zenitsu_2.0-debug.apk`
          files: release-assets/Zenitsu_2.0-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
