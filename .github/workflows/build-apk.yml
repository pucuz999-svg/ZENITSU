name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Assemble Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ensure environment properties file
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare stable APK filename
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Expected debug APK not found at $APK_SOURCE"
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_SOURCE" release-assets/Zenitsu_2.0-debug.apk
          ls -lh release-assets/Zenitsu_2.0-debug.apk

      - name: Upload Debug APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenitsu_2.0-debug-apk
          path: release-assets/Zenitsu_2.0-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zenitsu_2.0 Debug APK v1.0.${{ github.run_number }}
          body: |
            Automated debug APK build from commit `${{ github.sha }}`.

            ### Direct APK Download
            Download `Zenitsu_2.0-debug.apk` from the release assets below, or use the permanent latest download link:
            `https://github.com/${{ github.repository }}/releases/latest/download/Zenitsu_2.0-debug.apk`
          files: release-assets/Zenitsu_2.0-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
